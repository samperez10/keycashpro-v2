name: Build releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: Rust tests
        env:
          PYO3_PYTHON: python
        run: cargo test --locked
      - name: Embedded-source self-test
        env:
          PYO3_PYTHON: python
        run: |
          cargo build --release --locked
          ./target/release/keycash-solver --root "$GITHUB_WORKSPACE" --self-test

  alpine:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build and package in Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.23 sh -c 'apk add --no-cache build-base cargo rust python3-dev python3 py3-httpx py3-beautifulsoup4 ca-certificates binutils && sh scripts/build_alpine.sh'
          sudo chown -R "$(id -u):$(id -g)" dist target/alpine-*
      - uses: actions/upload-artifact@v7
        with:
          name: keycash-solver-alpine-x86_64
          path: |
            dist/keycash-solver-alpine-x86_64.tar.gz
            dist/keycash-solver-alpine-x86_64.tar.gz.sha256
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Test Python backend on Windows
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - name: Build Rust executable
        shell: pwsh
        run: |
          $env:PYO3_PYTHON = (Get-Command python).Source
          cargo test --locked
          cargo build --release --locked
      - name: Create self-contained portable package
        shell: pwsh
        run: ./scripts/package_windows.ps1 -Binary ./target/release/keycash-solver.exe
      - uses: actions/upload-artifact@v7
        with:
          name: keycash-solver-windows-x86_64
          path: |
            dist/keycash-solver-windows-x86_64.zip
            dist/keycash-solver-windows-x86_64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [alpine, windows]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-files/* --generate-notes --verify-tag
