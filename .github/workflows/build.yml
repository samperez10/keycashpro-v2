name: Build releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover -s tests -q
      - name: Rust tests
        env:
          PYO3_PYTHON: python
        run: cargo test --locked
      - name: Embedded-source self-test
        env:
          PYO3_PYTHON: python
        run: |
          cargo build --release --locked
          ./target/release/keycash-solver --root "$GITHUB_WORKSPACE" --self-test

  prepare_release:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Create draft release for a tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag

  alpine:
    runs-on: ubuntu-latest
    needs: [test, prepare_release]
    steps:
      - uses: actions/checkout@v7
      - name: Build and package in Alpine
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.23 sh -c 'apk add --no-cache build-base cargo rust python3-dev python3 py3-httpx py3-beautifulsoup4 ca-certificates binutils && sh scripts/build_alpine.sh'
          sudo chown -R "$(id -u):$(id -g)" dist target/alpine-*
          cp scripts/install_latest.sh dist/install.sh
      - name: Upload Alpine files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/keycash-solver-alpine-x86_64.tar.gz dist/keycash-solver-alpine-x86_64.tar.gz.sha256 dist/install.sh --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    runs-on: windows-latest
    needs: [test, prepare_release]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - name: Test Python backend on Windows
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -q
      - name: Build Rust executable
        shell: pwsh
        run: |
          $env:PYO3_PYTHON = (Get-Command python).Source
          cargo test --locked
          cargo build --release --locked
      - name: Create single-file portable executable
        shell: pwsh
        run: ./scripts/package_windows.ps1 -Binary ./target/release/keycash-solver.exe
      - name: Upload Windows files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME dist/KeycashSolver-Portable-x86_64.exe dist/KeycashSolver-Portable-x86_64.exe.sha256 --repo $env:GITHUB_REPOSITORY --clobber

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [alpine, windows]
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
