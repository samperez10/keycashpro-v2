[package]
name = "keycash-portable"
version = "1.1.6"
authors = ["xnote12"]
edition = "2024"
rust-version = "1.88"

[dependencies]
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[profile.release]
strip = "symbols"
debug = false
lto = "thin"
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
