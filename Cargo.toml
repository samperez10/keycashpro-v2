[package]
name = "keycash-solver"
version = "1.1.6"
authors = ["xnote12"]
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
crossterm = "0.28"
ratatui = "0.29"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"

[profile.release]
strip = "symbols"
debug = false
lto = "thin"
codegen-units = 1
